# ============================================================
# GCP Cloud Run — Document Portal
#
# Deploy the same FastAPI app to Google Cloud Run (free tier).
# Cloud Run auto-scales to zero when idle = no cost when not in use.
#
# Prerequisites:
#   1. gcloud CLI installed: https://cloud.google.com/sdk/docs/install
#   2. gcloud auth login
#   3. gcloud config set project YOUR_PROJECT_ID
#   4. Enable APIs:
#        gcloud services enable run.googleapis.com
#        gcloud services enable artifactregistry.googleapis.com
#
# Deploy:
#   cd infra/gcp
#   chmod +x deploy.sh
#   ./deploy.sh
# ============================================================

steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "europe-west2-docker.pkg.dev/$PROJECT_ID/document-portal/app:$COMMIT_SHA"
      - "."

  # Step 2: Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "europe-west2-docker.pkg.dev/$PROJECT_ID/document-portal/app:$COMMIT_SHA"

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - document-portal
      - "--image=europe-west2-docker.pkg.dev/$PROJECT_ID/document-portal/app:$COMMIT_SHA"
      - "--region=europe-west2"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=1Gi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=3"
      - "--set-env-vars=ENV=production,LLM_PROVIDER=openai"
      - "--set-secrets=OPENAI_API_KEY=openai-api-key:latest,GOOGLE_API_KEY=google-api-key:latest"

images:
  - "europe-west2-docker.pkg.dev/$PROJECT_ID/document-portal/app:$COMMIT_SHA"
